server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Penting buat React Router (BrowserRouter): route kayak /admin/opname
    # gak ada file fisiknya, jadi semua request non-file di-fallback ke
    # index.html biar React Router yang nentuin halaman mana yang dirender.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aset yang di-hash Vite (nama file udah unik per build, aman di-cache lama)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
